# Kemahiran yang dihantar deployment ini, dan alat yang setiap satu perlukan.
#
# Kemahiran ialah arahan ber nama yang sesiapa boleh panggil dengan `/`. Ia tidak menambah
# keupayaan: ia hanya meminta Bot menggunakan apa yang Bot itu sudah diberikan, dan setiap
# panggilan tetap diputuskan, disemak dasar dan direkodkan.
#
# NAMA ALAT DI SINI TIDAK MENGIZINKAN SESIAPA. Apa yang Bot boleh panggil ialah gerannya
# (grants), dan tawaran sentiasa disilangkan dengannya.
#
# Refs ialah `<serverId>/<namaAlat>`. `malaysia` ialah pelayan MCP tempatan deployment ini
# (Data & Organisasi Malaysia, port 4210, entri katalog first-party) yang ditambah pentadbir
# melalui POST /api/plugins/servers {"key": "malaysia"}, dan geran alat diberikan melalui
# POST /api/plugins/grants (contoh: examples/malaysia/bootstrap.ts).
#
# Padanan standard SKILL.md terbuka (agentskills.io): setiap kemahiran di sini ada padanannya
# dalam examples/malaysia/war-pack/skills/<slug>/SKILL.md untuk import ke mana-mana ejen yang
# mematuhi standard terbuka.
skills:
  # ============================ ASAS ORGANISASI ============================

  - slug: carta-organisasi
    title: Lukis carta organisasi
    summary: >-
      Dapatkan struktur organisasi Malaysia yang sah dari pelayan MCP malaysia dan lukis
      carta Mermaid yang kemas.
    instructions: >-
      Gunakan alat pelayan MCP "malaysia" yang anda pegang untuk mendapatkan data struktur
      yang tepat sebelum melukis. Untuk kerajaan persekutuan, mulakan dari
      carta_organisasi_persekutuan dan senarai_kementerian; untuk negeri, gunakan
      senarai_negeri; untuk syarikat, mulakan dari struktur_organisasi_templat dan suai
      mengikut keperluan. Keluarkan carta sebagai blok ```mermaid flowchart TD``` dengan
      jawatan dalam Bahasa Melayu, kemudian terangkan setiap lapisan dengan ringkas. Jika
      alat gagal atau tiada alat, katakan dengan jujur dan lukis templat umum dengan tanda
      jelas bahawa ia perlu disahkan. Jangan sekali-kali mereka nama individu.
    tools:
      - malaysia/carta_organisasi_persekutuan
      - malaysia/senarai_kementerian
      - malaysia/senarai_negeri
      - malaysia/struktur_organisasi_templat
      - malaysia/gred_perkhidmatan

  - slug: data-malaysia
    title: Data rasmi Malaysia
    summary: >-
      Cari dan baca data kerajaan Malaysia - senarai kementerian, negeri, dan set data
      terbuka data.gov.my.
    instructions: >-
      Gunakan alat pelayan MCP "malaysia" untuk data rasmi Malaysia. Untuk senarai
      kementerian atau negeri, gunakan alat senarai statik yang sedia; untuk statistik dan
      set data, cuba carian_dataset dan ambil_dataset (data.gov.my) dahulu, dan jika
      perkhidmatan itu tidak dapat dihubungi, katakan ia tidak tersedia sekarang dan tawarkan
      alternatif - jangan sesekali mereka angka statistik. Nyatakan sumber setiap data yang
      anda beri, dan nyatakan tarikh data bila alat itu memberikannya.
    tools:
      - malaysia/senarai_kementerian
      - malaysia/senarai_negeri
      - malaysia/gred_perkhidmatan
      - malaysia/carian_dataset
      - malaysia/ambil_dataset

  # ============================ KIT PERANG (BARU) ============================

  - slug: bilik-perang
    title: Taklimat Bilik Perang
    summary: >-
      Taklimat strategik lengkap: gabungkan konteks institusi, data rasmi dan analisis
      menjadi laporan keadaan yang boleh bertindak.
    instructions: >-
      Sediakan taklimat strategik mengikut struktur tetap: (1) Keadaan Semasa - apa yang
      berlaku dan siapa terlibat; (2) Isu Utama - 3 isu teratas dengan kesannya; (3) Pilihan
      Tindakan - sekurang-kurangnya 2 pilihan dengan kesan dan risiko setiap satu; (4)
      Cadangan - pilihan yang disyorkan dan sebabnya; (5) Perkara Tidak Disahkan. Gunakan
      alat pelayan MCP "malaysia": carta_organisasi_persekutuan untuk konteks institusi bila
      perkara menyentuh kerajaan atau pematuhan, carian_dataset untuk angka rasmi (jika tiada,
      tanda jelas "perlu disahkan" - jangan mereka angka), analisis_teks_bm untuk meringkaskan
      dokumen panjang yang diberi, dan glosari_kerajaan untuk istilah rasmi yang konsisten.
      Akhiri dengan SENARAI TINDAKAN: siapa (jabatan/Bot mana), buat apa, bila.
    tools:
      - malaysia/carta_organisasi_persekutuan
      - malaysia/carian_dataset
      - malaysia/analisis_teks_bm
      - malaysia/glosari_kerajaan

  - slug: ringkasan-mesyuarat
    title: Minit mesyuarat rasmi
    summary: >-
      Sediakan minit mesyuarat gaya rasmi Malaysia dengan jadual tindakan (siapa, apa, bila).
    instructions: >-
      Gunakan alat templat_minit_mesyuarat dari pelayan MCP "malaysia" sebagai kerangka,
      kemudian isikan dengan apa yang berlaku. Untuk setiap perkara: keputusan yang dibuat,
      bukan perbincangan panjang; untuk setiap tindakan: pegawai bertanggungjawab yang
      JELAS (nama atau jawatan), tarikh akhir sebenar (guna kalendar_cuti untuk elak tarikh
      akhir jatuh pada hari kelepasan am - hanya cuti tetap DISAHKAN), dan status. Selepas
      menulis, jalankan analisis_teks_bm pada minit anda dan kekal ringkas (sasaran: paling
      lambat 1 halaman untuk mesyuarat biasa). Keluarkan minit dalam format markdown yang
      boleh disalin terus. Jika butiran tiada (nama hadirin, tarikh), biar pemegang tempat
      yang jelas - jangan reka nama.
    tools:
      - malaysia/templat_minit_mesyuarat
      - malaysia/analisis_teks_bm
      - malaysia/kalendar_cuti

  - slug: terjemah-rasmi
    title: Terjemahan rasmi BM <-> EN
    summary: >-
      Terjemah dokumen BM <-> Inggeris dengan istilah rasmi Malaysia yang dikunci dari
      glosari.
    instructions: >-
      Terjemahan dua hala Bahasa Melayu <-> Inggeris dengan kualiti dokumen rasmi. Dulu:
      gunakan glosari_kerajaan dari pelayan MCP "malaysia" untuk mengunci istilah rasmi
      (gelaran, akta, nama entiti) - kekalkan nama rasmi tanpa menterjemah semula (contoh:
      "Akta Syarikat 2016" kekal; "Sdn Bhd" kekal). Kemudian: keluarkan terjemahan penuh
      dengan struktur dokumen asal dikekalkan (senarai, jadual, tajuk), diikuti 3-5 nota
      penterjemah tentang pilihan istilah yang samar sahaja. Jangan tambah atau buang
      maklumat; kekalkan nada (rasmi/mesra). Bila pengguna ada had panjang, semak dengan
      analisis_teks_bm dan tawarkan versi ringkas. Jika istilah tiada dalam glosari, pilih
      padanan paling biasa dan nyatakan pilihan itu dalam nota.
    tools:
      - malaysia/glosari_kerajaan
      - malaysia/analisis_teks_bm

  - slug: analisis-data
    title: Analisis set data Malaysia
    summary: >-
      Cari, baca dan analisis set data terbuka Malaysia dengan peraturan anti-reka angka.
    instructions: >-
      Aliran tetap: (1) carian_dataset di data.gov.my untuk set data yang relevan; (2)
      ambil_dataset untuk butiran dan sumber fail set data yang dipilih; (3) analisis_teks_bm
      dan penukar_unit untuk meringkas dan menormalkan angka (format RM, unit tempatan).
      PERATURAN MUTLAK: jangan sesekali mereka angka statistik. Jika data.gov.my gagal atau
      tiada set data sepadan, katakan dengan jelas, berikan apa yang anda TAHU dengan tanda
      "perlu disahkan", dan berikan URL sumber tepat (data.gov.my, dosm.gov.my) untuk
      pengguna semak sendiri. Untuk setiap penemuan: nyatakan sumber, tarikh data, skop
      (negeri/negara) dan had data. Jika carta perlu, minta mermaid_carta.
    tools:
      - malaysia/carian_dataset
      - malaysia/ambil_dataset
      - malaysia/analisis_teks_bm
      - malaysia/penukar_unit

  - slug: lukis-carta
    title: Jana carta organisasi Mermaid
    summary: >-
      Jana carta organisasi Mermaid yang sah dan kemas dari struktur yang anda berikan atau
      dari templat pelayan malaysia.
    instructions: >-
      Untuk carta organisasi mana-mana struktur: susun senarai nod (id, label, induk) dengan
      jawatan dalam Bahasa Melayu, kemudian panggil mermaid_carta dari pelayan MCP "malaysia"
      untuk jana dan sahkan carta - jangan tulis blok Mermaid dengan tangan bila alat ini
      ada, kerana alat itu mengesahkan id unik, induk wujud dan had 40 nod. Untuk organisasi
      kerajaan mulakan dari carta_organisasi_persekutuan; untuk syarikat mulakan dari
      struktur_organisasi_templat (jenis: sdn-bhd, berhad, glc, sme, koperasi; saiz: kecil,
      sederhana, besar). Jika alat melaporkan ralat pengesahan, baiki senarai nod mengikut
      ralat itu dan panggil semula. Keluarkan blok Mermaid akhir dengan penerangan ringkas
      setiap lapisan, dan jangan sesekali letak nama individu dalam carta - jawatan sahaja.
    tools:
      - malaysia/mermaid_carta
      - malaysia/struktur_organisasi_templat
      - malaysia/carta_organisasi_persekutuan

  - slug: hari-kelepasan
    title: Perancangan cuti Malaysia
    summary: >-
      Semak hari kelepasan am Malaysia untuk perancangan tarikh - hanya cuti tetap DISAHKAN
      boleh dirancang terus.
    instructions: >-
      Gunakan alat kalendar_cuti dari pelayan MCP "malaysia" untuk senarai hari kelepasan am.
      PERATURAN: hanya cuti bertanda DISAHKAN (tetap Gregorian) boleh digunakan untuk
      perancangan terus; cuti bertanda PERLU DISAHKAN (takwim Islam/Cina/Tamil) mesti
      ditanda "perlu disahkan dengan kalendar rasmi" dalam jawapan anda. Bila pengguna
      merancang tarikh akhir atau acara, semak jangan jatuh pada hari kelepasan am dan tawarkan
      tarikh alternatif bila berlanggar. Nyatakan bahawa cuti khusus negeri tidak disertakan
      oleh alat ini. Untuk perancangan bajet atau nilai kewangan berkaitan, gunakan
      penukar_unit untuk format RM yang konsisten.
    tools:
      - malaysia/kalendar_cuti
      - malaysia/penukar_unit

  # ============================ FLOK F&B (BARU) ============================

  - slug: scenari-fnb
    title: Nilai senario F&B Malaysia
    summary: >-
      Bandingkan enam senario perniagaan F&B (kopitiam, kafe, dapur awan, keluarga, katering,
      food truck) dengan data pasaran DOSM yang disahkan.
    instructions: >-
      Gunakan alat scenari_fnb dari pelayan MCP "malaysia" SEBELUM memberi sebarang cadangan
      perniagaan F&B. Angka pasaran dari alat ialah DISAHKAN (DOSM: hasil RM83.0B 2025,
      136,453 pertubuhan); angka modal/margin ialah ANGGARAN dan mesti dilabel begitu.
      Peraturan kewangan yang disahkan: SST perkhidmatan F&B = 6% (bukan 8%) ambang
      RM1,500,000/12 bln; sewa 8% ambang RM500k dari 1 Jul 2025; halal JAKIM sah 2 tahun
      via MYeHALAL. Sentiasa jalankan kira_bep bagi cadangan perniagaan sebelum syorkan,
      dan jangan sesekali janji keuntungan atau kadar kejayaan. Akhiri dengan senarai
      perkara yang pengguna perlu sahkan sendiri (modal sebenar, sewa, permit PBT).
    tools:
      - malaysia/scenari_fnb
      - malaysia/kira_bep

  - slug: kos-menu-fnb
    title: Kos menu & harga F&B
    summary: >-
      Kira kos bahan -> harga jual -> BEP untuk menu F&B dengan piawaian food-cost 28-35%
      dan harga psikologi.
    instructions: >-
      Aliran tetap: (1) senaraikan bahan dengan anggaran kos per unit (label ANGGARAN bila
      tiada data pembekal); (2) kalkulator_harga_jual untuk harga jual sasaran food-cost
      28-35% dengan pembundaran psikologi RM0.90; (3) kira_bep untuk semak kesihatan
      perniagaan (amaran <1.1x BEP). Ingatkan pengguna: kos pembolehubah mesti masukkan
      pembungkus DAN komisen platform delivery (dilaporkan 25-35%, ANGGARAN) untuk jualan
      online; SST F&B 6% hanya bila jualan > RM1.5M. Jangan beri harga tanpa alat - semua
      harga mesti keluar dari kalkulator_harga_jual supaya konsisten.
    tools:
      - malaysia/kalkulator_harga_jual
      - malaysia/kira_bep
      - malaysia/penukar_unit

  - slug: kempen-fnb
    title: Kempen kandungan F&B
    summary: >-
      Pelan kandungan mingguan TikTok/IG/WhatsApp untuk jenama F&B mengikut funnel tempatan
      Malaysia.
    instructions: >-
      Gunakan alat pelan_kandungan_fnb dari pelayan MCP "malaysia" sebagai kerangka mingguan,
      kemudian tulis kandungan sebenar (kapsyen, skrip, teks skrin) dalam BM mesra. Funnel
      tempatan: Kesedaran -> Percubaan -> Berulang -> Advokasi; satu kandungan satu mesej;
      hook 3 saat pertama kuat. Semak analisis_teks_bm untuk panjang (kapsyen <150 perkataan)
      dan kalendar_cuti untuk musim kempen (hanya cuti DISAHKAN untuk perancangan terus).
      Hormati sensitiviti: halal, puasa (elak kandungan makanan siang Ramadhan), perayaan
      pelbagai kaum. Tiada klaim kesihatan palsu, tiada diskaun palsu, semua harga dilabel
      "sahkan dengan pemilik" bila pengguna tidak beri. Untuk storyboard video/prompt AI
      imej, bekerjasama dengan Ejen Pemasaran AI; untuk salinan broadcast WhatsApp, rujuk
      Ejen CRM.
    tools:
      - malaysia/pelan_kandungan_fnb
      - malaysia/analisis_teks_bm
      - malaysia/kalendar_cuti

  - slug: prospek-fnb
    title: Pipeline prospek B2B F&B
    summary: >-
      Jana senarai sasaran B2B (katering korporat, acara, franchise) dengan ICP, draf
      perhubungan dan jadual susulan hari 1/3/7/14.
    instructions: >-
      Untuk sebarang kerja prospek B2B: mulakan dengan scenari_fnb untuk konteks segmen
      (katering = RM6.7B, 16,208 pertubuhan, DISAHKAN). Hasilkan: (1) ICP kelayakan (saiz,
      bajet, tempoh, geografi - prioritikan KL/Selangor = 40% output negara, DISAHKAN); (2)
      senarai sasaran bila pengguna beri nama - senarai dari ingatan mesti dilabel "perlu
      disahkan", jangan buat-buat kenalan; (3) draf sentuhan pertama (WhatsApp <=80 perkataan
      atau emel <=150 perkataan, satu CTA); (4) jadual susulan hari 1/3/7/14 dengan sudut
      berbeza; (5) kalkulator_harga_jual untuk kos per pax sebelum margin bila sebut harga
      katering. Hormati PDPA 2010: tiada data lebih daripada perlu, sentiasa ada pilihan
      berhenti. Lapor prospek dalam format: nama, sumber, tahap (sejuk/suai/panas), tindakan
      seterusnya.
    tools:
      - malaysia/scenari_fnb
      - malaysia/kalkulator_harga_jual
      - malaysia/analisis_teks_bm

  - slug: balasan-ulasan
    title: Balasan ulasan pelanggan
    summary: >-
      Jana balasan ulasan Google Maps/platform delivery dalam BM dan EN dengan nada jenama
      konsisten - tanpa janji bayaran balik automatik.
    instructions: >-
      Gunakan alat jawab_ulasan dari pelayan MCP "malaysia" untuk SEMUA balasan ulasan,
      kemudian suaikan nada jenama yang pengguna minta. Garis merah: jangan janji bayaran
      balik/percuma tanpa kelulusan pemilik; elak pertengkaran awam; alihkan resolusi ke
      WhatsApp/DM. Ulasan negatif: akui -> maaf ikhlas -> tindakan konkrit (tanya pemilik
      apa tindakan sebenar yang boleh ditawarkan) -> saluran luar talian. Ulasan positif:
      terima kasih + jemput kembali + kongsi dengan krew. Balas semua ulasan dalam 24-48
      jam - ulasan Google mempengaruhi trafik carian "kedai makan dekat sini". Untuk
      kandungan suara/khidmat pelanggan lanjut, rujuk Ejen Suara.
    tools:
      - malaysia/jawab_ulasan
      - malaysia/analisis_teks_bm

  # ============================ META (sedia ada) ============================

  - slug: skill-creator
    title: Tulis satu kemahiran
    summary: Wawancara saya tentang kemahiran yang saya mahu, kemudian tulis dan simpan.
    instructions: >-
      Anda menulis satu kemahiran: arahan bernama yang sesiapa dalam deployment ini boleh
      panggil dengan `/`. Wawancara dahulu, tulis kemudian, dan simpan hanya apa yang orang
      itu sudah setuju. Satu kemahiran di sini ialah empat perkara dan tiada yang lain: satu
      slug sebagai identitinya, satu tajuk untuk menu, satu ringkasan satu baris, dan
      arahan yang Bot ikut bila dipanggil. Ia boleh menyatakan alat yang diperlukannya, dan
      itu pernyataan bukan geran: alat yang Bot tidak pegang tidak akan dimuatkan. Tiada
      fail, tiada skrip, tiada lampiran. Apa yang tidak muat dalam medan itu bukan kemahiran.

  - slug: bot-creator
    title: Buat satu Bot
    summary: Tentukan apa Bot baru patut jadi, kemudian letakkannya di hadapan anda untuk dicipta.
    instructions: >-
      Anda menentukan apa seorang rakan sekerja baru patut jadi, dan wawancara itu lebih
      penting daripada kelajuan: apa yang anda tulis menjadi arahan tetap yang diserahkan
      kepada model pada setiap giliran dalam setiap saluran yang rakan sekerja itu berada.
      Mulakan dengan list_bots. Jika sesuatu di sini sudah buat kerja yang diterangkan,
      katakan begitu dan tawarkan yang itu. Tulis name, title, role_description dan
      instructions yang pendek, khusus dan boleh diukur, kemudian tawarkan untuk mencipta
      Bot itu dengan save_bot, dan tunggu kelulusan sebelum menyimpan.

  # ============================ CUACA / TUKARAN / SOLAT ============================

  - slug: cuaca-harian
    title: Cuaca harian Malaysia
    summary: >-
      Cuaca semasa dan ramalan harian untuk bandar Malaysia dalam Bahasa Melayu, untuk
      perancangan acara luar, penghantaran dan perjalanan.
    instructions: >-
      Gunakan alat pelayan MCP "cuaca" untuk soalan cuaca. Untuk lokasi yang samar, panggil
      cuaca/cari_lokasi dahulu dan tunjukkan pilihan kepada pengguna sebelum memilih. Untuk
      soalan "sekarang", gunakan cuaca/cuaca_semasa; untuk perancangan, gunakan
      cuaca/ramalan_cuaca dengan bilangan hari yang sesuai (1-7) dan terjemahkan ramalan itu
      kepada cadangan praktikal (cth. "rabu hujan lebat - tunda penghantaran"). SENTIASA
      nyatakan bahawa sumbernya Open-Meteo dan bahawa amaran cuaca rasmi (ribut petir,
      angin kencang, banjir) mesti disemak di MetMalaysia met.gov.my. Jangan sekali-kali
      mereka angka cuaca daripada ingatan - hanya angka yang alat pulangkan.
    tools:
      - cuaca/cuaca_semasa
      - cuaca/ramalan_cuaca
      - cuaca/cari_lokasi

  - slug: kadar-tukaran
    title: Kadar tukaran matawang
    summary: >-
      Kadar pertukaran harian dan penukaran matawang (MYR disokong) untuk anggaran kos,
      bajet perjalanan dan perbandingan harga antara negara.
    instructions: >-
      Gunakan alat pelayan MCP "tukaran". Untuk kadar semasa, gunakan
      tukaran/kadar_semasa; untuk jumlah tertentu, gunakan tukaran/tukar_matawang; jika
      tidak pasti sesuatu kod matawang wujud, gunakan tukaran/senarai_matawang dahulu.
      SENTIASA nyatakan bahawa kadar ini harian (exchangerate-api, tarikh kemaskini alat
      pulangkan) dan bahawa kadar sebenar bank atau penukar wang berbeza kerana yuran dan
      spread; untuk keputusan kewangan besar, rujuk BNM (bnm.gov.my) atau bank pengguna.
      Jangan sekali-kali mereka kadar daripada ingatan.
    tools:
      - tukaran/kadar_semasa
      - tukaran/tukar_matawang
      - tukaran/senarai_matawang

  - slug: waktu-solat
    title: Waktu solat JAKIM
    summary: >-
      Waktu solat rasmi JAKIM untuk semua zon daerah Malaysia (bulan semasa), hari ini
      atau esok - untuk jadual peribadi, mesyuarat di masjid dan pengurusan hari.
    instructions: >-
      Gunakan alat pelayan MCP "solat". Jika pengguna menyebut negeri atau daerah tanpa
      kod zon, panggil solat/senarai_zon_solat dengan penapis negeri itu dan minta mereka
      pilih zon yang tepat sebelum memanggil solat/waktu_solat. Default alat ialah hari
      ini; "esok" diterima melalui parameter hari. SENTIASA nyatakan zon yang digunakan
      dalam jawapan (cth. "SGR01 - Gombak/Petaling/Shah Alam") kerana zon bersebelahan
      berbeza beberapa minit, dan bahawa untuk kegunaan rasmi jadual bulanan, rujuk
      e-solat JAKIM (www.e-solat.gov.my). Alat ini bulan semasa sahaja - jangan anggar
      waktu untuk bulan lain.
    tools:
      - solat/senarai_zon_solat
      - solat/waktu_solat

  # ============================ PAKAR AGENCY (MIT) ============================
  #
  # Lima belas kemahiran pakar yang diimport daripada repo Agency Agents
  # (github.com/msitarzewski/agency-agents, lesen MIT) — roster 268 watak pakar
  # perniagaan yang dikondensatkan kepada arahan Bahasa Melayu. Setiap satu ada
  # padanannya dalam war-pack/skills/<slug>/SKILL.md mengikut standard terbuka
  # agentskills.io. Skill-skill ini instruksional: tiada rujukan alat, kerana
  # kepakaran itu datang daripada disiplin kerja, bukan daripada pelayan MCP.
  # Atribusi sumber kekal dalam seksyen "Bila guna" setiap SKILL.md.
  #
  - slug: agency-media-sosial
    title: Strategis Media Sosial
    summary: >-
      Bina strategi media sosial merentas LinkedIn, X (Twitter) dan platform profesional — kalendar kandungan bersepadu, pengurusan kempen, dan kedudukan kepimpinan minda. Guna bila pengguna mahu menyelaraskan jenama merentas pelbagai platform atau membina autoriti B2B melalui media sosial.
    instructions: >-
      1. Satukan mesej jenama dengan tema teras yang sama di semua platform, tetapi adaptasi format kepada kekuatan setiap platform — jangan salin-tampal kandungan mentah antara platform. 2. Bina dua lapisan LinkedIn berasingan: halaman syarikat (kemas kini rutin, sorotan pekerja, insight industri, berita produk) dan jenama peribadi eksekutif (artikel panjang, penerbitan konsisten, newsletter). 3. Guna model "air terjun kandungan": kandungan utama diterbitkan di platform teratas dahulu, kemudian versi ringkas format-native diedarkan ke platform lain. 4. Bina kalendar editorial dengan objektif terukur per platform, segmentasi audiens dan jadual penerbitan terselar sebelum kempen dilancarkan. 5. Sasaran metrik: kadar engagement LinkedIn 3%+ untuk pos halaman syarikat, 5%+ untuk kandungan jenama peribadi, pertumbuhan reach gabungan 20% sebulan, dan pertumbuhan pengikut 8% sebulan. 6. Sasaran ROI iklan sosial 3x ke atas, dan jejak kontribusi pipeline yang boleh diukur daripada saluran sosial. 7. Reka program peguam jenama (employee advocacy) dengan sasaran penyertaan pekerja 30%+ untuk melipatgandakan reach organik. 8. Jalankan pendengaran sosial (social listening) dan penanda aras kompetitor: ukur share of voice berbanding pesaing, bukan sekadar metrik akaun sendiri. 9. Bina kepimpinan minda melalui penerbitan konsisten, ulasan industri semasa, dan dokumentasi pencapaian untuk peluang ceramah serta media. 10. Jangan guna nada berbeza yang bercanggah antara platform — suara jenama mesti konsisten walaupun format berubah. 11. Jangan kejar trend tanpa kaitan industri; kekal dalam sempadan kepakaran dan nilai jenama. 12. Format output: strategi per platform dengan objektif terukur, kalendar kandungan, pelan iklan, dan cadangan penambahbaikan berasaskan data — bukan nasihat generik.

  - slug: agency-tiktok
    title: Strategis TikTok
    summary: >-
      Rancang kandungan TikTok yang bertumbuh: hook 3 saat, campuran pillar 40/30/20/10, strategi audio dan hashtag, kerjasama kreator ikut tier, serta adaptasi ke Reels dan Shorts. Guna bila pengguna mahu tumbuh jenama di TikTok atau meningkatkan konversi TikTok Shop.
    instructions: >-
      1. Fikir dalam micro-content: setiap video mesti memegang perhatian dalam 3 saat pertama — tanpa hook yang kuat, video itu tidak akan dipushkan. 2. Guna campuran pillar kandungan 40% pendidikan, 30% hiburan, 20% inspirasi, 10% promosi. 3. Prioritikan kadar siap tonton (completion rate): algoritma memberi trafik bila video ditonton penuh dan mendapat like, komen serta share dengan pantas dalam jam pertama. 4. Sasaran metrik: engagement rate 8%+ (purata industri 5.96%), kadar siap tonton 70%+ untuk kandungan berjenama, dan pertumbuhan pengikut organik 15% sebulan. 5. Guna 5-8 hashtag setiap pos dengan gabungan hashtag trending, niche dan berjenama. 6. Bahagikan kerjasama kreator ikut tier — nano (1K-10K), mikro (10K-100K), mid (100K-1M), makro (1M+) — dan sasaran ROI perkongsian kreator 4:1. 7. Bina kitaran duet, stitch dan cabaran hashtag berjenama untuk mendorong kandungan yang dijana pengguna (UGC) serta pengurusan komen yang aktif. 8. Uji pelbagai variasi kreatif bagi setiap kempen iklan merentasi format In-Feed, Spark Ads, TopView dan kesan berjenama. 9. Adaptasi kandungan TikTok-first ke Instagram Reels dan YouTube Shorts hanya selepas ia terbukti berprestasi di TikTok. 10. Untuk TikTok Shop, sasaran kadar tukar beli 3%+ bagi kandungan beli-belah dan kadar klik 12% ke laman web. 11. Gabungkan audio trending dengan ketulenan jenama — jangan paksa jenama masuk trend yang tidak berkait; semua kandungan mesti mobile-first menegak. 12. Jangan abaikan komen dan komuniti: engagement dua hala, duet dan stitch adalah sebahagian strategi, bukan tambahan selepas pos. 13. Format output: pelan kandungan dengan hook, struktur cerita (pembuka-tengah-penamat), senarai hashtag, pemilihan audio, dan metrik sasaran yang boleh diukur.

  - slug: agency-livestream
    title: Jurulatih Livestream Commerce
    summary: >-
      Jurulatih niaga livestream: skrip jualan lima fasa, urutan produk (trafik/wira/untung/ flash deal), imbangan trafik organik vs berbayar, dan ulasan data masa nyata untuk menaikkan GMV. Guna bila pengguna menjual secara live (TikTok Live, Shopee Live) atau mahu melatih hos dan membaiki prestasi bilik live.
    instructions: >-
      1. Pegang formula teras: Trafik x Kadar Tukar Beli x Nilai Purata Pesanan = GMV, tetapi metrik yang menentukan trafik percuma ialah masa tonton dan kadar engagement. 2. Susun keutamaan data ikut rank platform: masa tonton > kadar engagement (komen/like/follow) > kadar klik produk > kadar tukar beli — platform menilai tingkah laku penonton dalam bilik live, bukan tempoh streaming. 3. Sasaran metrik: masa tonton purata melebihi 1 minit, kadar engagement melebihi 5%, kadar tukar beli bayaran melebihi 3%, dan GPM (GMV per 1,000 tontonan) melebihi 800. 4. Guna skrip lima fasa untuk setiap produk: kail retensi > pengenalan produk > bina kepercayaan > tutup dengan urgensi > susulan dan transisi. 5. Reka campuran produk: produk trafik (bina penonton) + produk wira (dorong GMV) + produk untung + flash deal (dongakkan metrik), dan padankan urutan dengan gelombang trafik — produk yang dipaparkan semula apabila trafik organik melonjak menentukan kadar tukar beli anda. 6. Dalam fasa sejuk permulaan (30 sesi pertama), jangan kejar GMV — bina data masa tonton dan engagement supaya algoritma mempelajari profil audiens anda. 7. Urus nisbah trafik berbayar vs organik berperingkat: 70/30 semasa permulaan, 50/50 semasa pertumbuhan, 30/70 semasa matang — bilik live matang perlu lebih 50% trafik organik. 8. Bila penonton jatuh, teruskan flash deal untuk retensi dahulu sebelum pitch produk untung; jika waktu mati (dead air) melebihi 30 saat, picu skrip engagement atau tukar produk serta-merta. 9. Gunakan teknik hold-and-release: kekalkan harga sebagai teka-teki 2-3 minit sambil kukuhkan nilai produk, kemudian umumkan harga dengan kira detik dan had kuantiti. 10. Kekal patuh pada larangan kata: jangan kata "paling murah" — guna "tawaran eksklusif live kami"; jangan janjikan kesan kosmetik atau manfaat kesihatan makanan, dan jangan hina pesaing. 11. Jangan bergantung pada satu hos — bina kumpulan hos sandaran, hadkan sesi maksimum 6 jam, dan nilaikan hos pada metrik proses (kelicinan skrip, frekuensi interaksi, kawalan rentak), bukan hasil semata-mata. 12. Buat ulasan data dalam masa 2 jam selepas tamat: GMV, GPM, UV value, pecahan sumber trafik, dan funnel penuan (tontonan > masuk bilik live > tonton melebihi 30 saat > klik troli > pesanan > bayaran). 13. Format output: skrip produk 5 minit sesuatu produk, pelan urutan produk dengan julat harga, papan metrik harian dengan sasaran, dan senarai keutamaan penambahbaikan esok.

  - slug: agency-edagang-sempadan
    title: Pakar E-Dagang Sempadan
    summary: >-
      Strategi e-dagang sempadan merentas Amazon, Shopee, Lazada, AliExpress, Temu dan TikTok Shop: pemilihan produk, pematuhan (VAT, sijil produk), logistik antarabangsa, listing pelbagai bahasa dan disiplin margin. Guna bila pengguna mahu menjual ke pasaran luar negara atau memasuki marketplace baharu.
    instructions: >-
      1. Ingat tiga penguasa e-dagang sempadan: lokalisasi menentukan traksi, pematuhan menentukan kelangsungan hidup, dan rantaian bekalan menentukan untung — "senaraikan produk tempatan di luar negara" bukan strategi. 2. Pelajari logik trafik setiap platform dahulu: Amazon dipacu carian + iklan dengan kesihatan akaun sebagai nyawa; Shopee/Lazada dipacu kempen platform (9.9/11.11/12.12); TikTok Shop dipacu video pendek + livestream; Temu menuntut kos rantaian bekalan paling rendah. 3. Sediakan pecahan kos penuh bagi setiap SKU: pembelian + logistik first-mile + yuran gudang + komisen platform + iklan + penghantaran last-mile + kerugian pemulangan + fluktuasi FX; sasaran margin bersih melebihi 20%, dengan julat harga jualan 15-50 USD sebagai garis penapisan awal. 4. Untuk Amazon, kawal ACOS pada 20-25% dan TACOS di bawah 12%; bina iklan berperingkat — fasa pelancaran alihkan 40% bajet kepada kempen auto untuk pungut data kata kunci sebelum kempen manual. 5. Tulis tajuk listing dengan formula Jenama + Kata Kunci Teras + Atribut + Kelebihan + Spesifikasi; terjemahan mesin ialah pembunuh tukar beli paling besar, jadi semakan penutur asli adalah wajib. 6. Jangan senaraikan produk tanpa sijil wajib pasaran sasaran (CE/FCC/FDA dan setara) — kesan pencerobohan bermakna nyahsenaraikan dan denda; VAT/Sales Tax mesti difailkan dengan betul, dan pelanggaran hak milik intelek (tiruan, imej tanpa kebenaran) disifatkan sifar toleransi. 7. Di Shopee/Lazada, kira untung sebenar bagi setiap kempen — jangan sertai kempen pada harga rugi semata-mata untuk mengejar GMV. 8. Jangan hantar semua stok ke FBA sekaligus — uji respons pasaran dengan stok sebulan dahulu; pantau pusing ganti inventori (sasaran 6x setahun atau lebih) kerana yuran simpanan jangka panjang membunuh untung secara senyap. 9. Tetapkan harga mengikut kuasa beli dan landskap kompetitor tempatan, bukan sekadar penukaran mata wang. 10. Urus khidmat pelanggan mengikut zon waktu pasaran sasaran — Amazon menuntut balasan dalam 24 jam — dan sediakan templat balasan bagi isu lazim serta proses eskalasi. 11. Jangan salin-tampal playbook e-dagang tempatan ke pasaran luar; kaji peraturan platform dahulu, bina strategi kemudian. 12. Format output: penilaian produk tiga dimensi (pasaran/margin/pematuhan), perbandingan strategi antara marketplace, dan pelan iklan berperingkat dengan angka serta bajet.

  - slug: agency-seo
    title: Pakar SEO
    summary: >-
      Strategi SEO mampan: audit teknikal, kluster kata kunci berasaskan intent, pencegahan kannibalisasi antara halaman, Core Web Vitals dan binaan pautan beretika (white-hat). Guna bila pengguna mahu menaikkan trafik organik, menyusun strategi kandungan carian, atau mengesan punca ranking jatuh.
    instructions: >-
      1. Sebelum sebarang cadangan tajuk, H1 atau kandungan, jalankan audit kannibalisasi antara halaman dahulu — halaman yang menarik impresi dan klik terbanyak bagi sesuatu kata kunci "memiliki" kata kunci itu, dan jangan serahkannya kepada halaman lain. 2. Tag tajuk dan H1 dua halaman tidak boleh berkongsi kata kunci utama yang sama; jika dua halaman ranking bagi kata kunci sama dalam top 20 dengan klik berpecah, itu kannibalisasi aktif — selesaikan dahulu sebelum menambah kandungan. 3. Guna arkitektur kluster topik: halaman pillar menyasarkan istilah utama, halaman satelit menyasarkan long-tail — setiap halaman ada SATU peranan utama dalam kluster. 4. Taati E-E-A-T: semua cadangan kandungan mesti menunjukkan pengalaman, kepakaran, autoriti dan kebolehpercayaan, termasuk pautan keluar kepada sumber berwibawa. 5. Core Web Vitals tidak boleh dirunding: LCP di bawah 2.5 saat, INP di bawah 200ms, CLS di bawah 0.1. 6. Kekal white-hat sahaja: jangan cadangkan skim pautan, cloaking, keyword stuffing atau teks tersembunyi; letakkan intent pengguna diutamakan — ranking mengikuti nilai. 7. Bina penyasaran kata kunci daripada data sebenar (volume carian, kesukaran, klasifikasi intent), bukan tekaan, dan asingkan trafik branded daripada non-branded ketika melaporkan prestasi. 8. Struktur on-page: title tag 50-60 aksara, meta description 150-160 aksara, kata kunci utama dalam 100 patah perkataan pertama, hierarki H2-H3 logik, dan seksyen FAQ bagi pertanyaan People Also Ask. 9. Bina pautan melalui digital PR, aset kandungan boleh rujuk dan outreach strategik (pautan rosak, sebutan jenama tanpa pautan) — sasaran 5-10 pautan PR bulanan tambahan 10-15 pautan kandungan. 10. Untuk laman pelbagai bahasa, isytiharkan hreflang secara resiprokal (setiap URL mesti memaut balik ke semua varian) dan tetapkan atribut lang; halaman dwibahasa tanpa tag dianggap satu dokumen kabur — pecahkan kepada URL per bahasa. 11. Beri garis masa realistik: SEO mengkompaun dalam tempoh berbulan, bukan hari — jangan menjanjikan ranking dalam minggu. 12. Format output: laporan audit (crawlabiliti, indexasi, Core Web Vitals, data berstruktur), dokumen strategi kata kunci per kluster dengan volume/kesukaran/intent, dan senarai tindakan diperingkatkan mengikut impak versus usaha.

  - slug: agency-xiaohongshu
    title: Pakar XiaoHongShu
    summary: >-
      Strategi XiaoHongShu (Red): naratif gaya hidup, nisbah kandungan 70/20/10, estetika visual konsisten, frekuensi pos 3-5 kali seminggu dan engagement komuniti yang tulen. Guna bila pengguna mahu membina jenama gaya hidup, kandungan berviral atau jualan e-dagang melalui XiaoHongShu.
    instructions: >-
      1. Kekalkan nisbah kandungan 70% gaya hidup organik, 20% penyertaan trend, 10% promosi jenama langsung — jualan keras merosakkan akaun. 2. Pos 3-5 kali seminggu (cukup untuk algoritma, jangan lebih) dan berinteraksi dengan komuniti dalam masa 2 jam selepas pos demi jangkauan maksimum. 3. Sasaran metrik: kadar engagement 5%+ (asas XiaoHongShu lebih tinggi daripada Instagram), kadar share 2%+, kadar simpanan (collection save) 8%+, dan kadar klik CTA 3%+. 4. Sertakan CTA strategik dalam setiap pos (ikut, simpan, klik pautan, ke kedai) tetapi balut dengan bahasa gaya hidup, bukan pitch jualan. 5. Optimakan masa pos mengikut puncak aktiviti demografik sasaran — lazimnya 7-9 malam dan waktu makan tengah hari. 6. Prioritikan format gambar 9:16 dan video 15-60 saat; kekalkan estetika konsisten (gaya fotografi, filter, grading warna, tipografi) merentas semua kandungan. 7. Kenal pasti trend baharu dalam masa 24 jam dan sertai dengan cara yang selari nilai jenama; gabungkan hashtag trending dan niche untuk jumpaian. 8. Rancang kalendar kandungan 30 hari dengan 4-5 pillar kandungan tetap yang selar jenama dan minat audiens. 9. Utamakan komuniti, bukan metrik vanity: 30%+ engagement patut datang daripada komen bermakna, bukan sekadar like. 10. Kerjasama dengan mikro-influencer (10K-100K pengikut) untuk amplitifikasi autentik, dan reka kempen UGC serta cabaran hashtag berjenama bagi penglibatan komuniti. 11. Jangan bunyi korporat — suara jenama perlu terasa tulen, mesra dan boleh dikaitkan; gunakan bahasa vernakular dan budaya platform. 12. Sasaran pertumbuhan: 15-25% pengikut sebulan, 1-2 pos viral 100K+ tontonan setiap bulan, dan 10-20% trafik e-dagang atau aplikasi disumbangkan oleh XiaoHongShu. 13. Format output: pelan penjenamaan gaya hidup, kalendar kandungan 30 hari, panduan estetika, dan semakan prestasi mingguan dengan iterasi berasaskan data.

  - slug: agency-tawaran-prospek
    title: Strategis Tawaran & Penjanaan Prospek
    summary: >-
      Reka tawaran grand-slam melalui persamaan nilai, lead magnet yang memberi nilai sebenar secara berdiri sendiri, dan pemilihan saluran penjanaan prospek Core Four dengan disiplin Rule of 100. Guna bila konversi lemah, trafik tiada, atau pengguna mahu membina funnel atas dari kosong.
    instructions: >-
      1. Ikut urutan tetap: tawaran dahulu, lead magnet kedua, saluran ketiga, amplifier keempat — kebanyakan masalah jualan sebenarnya masalah tawaran yang menyamar. 2. Guna persamaan nilai: Nilai = (Hasil Dream x Kebarangkalian Diperoleh) / (Jeda Masa x Usaha & Pengorbanan) — setiap keputusan reka bentuk tawaran sama ada menaikkan pengangka atau menurunkan penyebut. 3. Apabila konversi lemah, jangan sentuh harga dahulu: naikkan hasil dream (dalam bahasa pembeli sendiri), timbun bukti dan jaminan (tanpa syarat / bersyarat / anti-guarantee), mampatkan jeda masa ke hasil pertama (done-for-you > done-with-you > DIY), dan buang setiap langkah usaha pembeli. 4. Lead magnet ialah penyelesaian lengkap kepada masalah sempit yang ditukar dengan maklumat hubungan — ia mesti berguna secara berdiri sendiri; jika pembeli berhenti di magnet sahaja, mereka patut masih rasa berbaloi. 5. Terdapat tiga jenis magnet sahaja: selesaikan masalah (kalkulator, pelan siap, diagnostik), mendidik (menzahirkan masalah yang lebih besar daripada disedari), dan sample (cebisan produk berbayar) — magnet yang lebih canggih menarik pembeli yang lebih canggih. 6. Satu magnet per persona per peringkat — jangan guna satu magnet untuk tiga jenis pembeli kerana ia terlalu generik untuk semua. 7. Jangan bina capture yang tidak boleh dihormati: siri welcome, kandungan nurture dan perbualan jualan mesti siap SEBELUM magnet dilancarkan. 8. Kuasai SATU saluran Core Four dahulu (warm outreach, post free content, cold outreach, paid ads) sebelum menambah saluran kedua — pasukan gagal kerana terpecah tipis sejak hari pertama. 9. Ikut Rule of 100: 100 aktiviti menjana prospek utama sehari selama 100 hari (100 DM sejuk, 100 email outbound, atau 100 kandungan diterbitkan sebulan) — kebanyakan perniagaan gagal kerana kurang reach, bukan kurang plan pintar. 10. Urutan validasi: mulakan dengan warm outreach untuk mengesahkan tawaran, pindah ke satu saluran boleh skala, dan tambah iklan berbayar hanya selepas CAC terbukti mampu dibayar oleh LTV. 11. Pegang lantai ekonomi: LTV:CAC sekurang-kurangnya 3:1 (itu lantai, bukan sasaran), payback CAC di bawah 6 bulan, dan komisen affiliate lazim 20-50% daripada harga front-end. 12. Aktifkan amplifier berurutan: pelanggan (rujukan) dahulu, kemudian pekerja, kemudian affiliate dan partner — dan jangan sesekali mengupah agensi untuk saluran yang anda belum buktikan sendiri. 13. Jangan biarkan affiliate menyelamatkan tawaran lemah — betulkan tawaran dahulu, dan ambil keputusan saluran ikut urutan More > Better > New tanpa tambah saluran baharu sebelum "more" dan "better" habis diperjuangkan. 14. Format output: pelan tawaran (empat lever persamaan nilai + nisbah nilai-kepada-harga sasaran sekurang-kurangnya 10x), spec magnet (persona, jenis, mekanisme capture, siri nurture), dan pelan saluran dengan sasaran aktiviti harian serta kitaran ukur mingguan.

  - slug: agency-outbound
    title: Strategis Outbound
    summary: >-
      Bina pipeline melalui outbound berasaskan signal, bukan volume: ICP yang boleh disangkal, pengasingan akaun ber-tier, jujukan multichannel 8-12 sentuhan, dan email sejuk yang berbalas. Guna bila pasukan perlu menempah meeting secara proaktif atau reply rate berada di tahap rendah.
    instructions: >-
      1. Jadikan bukti sebagai pencetus outreach, bukan kuota: outreach berdasarkan buying signal bertukar 4-8x lebih tinggi daripada cold outreach tanpa trigger. 2. Susun signal ikut kekuatan intent: Tier 1 ialah isyarat pembelian aktif (kunjungan laman harga, carian perbandingan pesaing, RFP); Tier 2 ialah perubahan organisasi (pimpinan baharu, pembiayaan, lonjakan pengambilan, M&A); Tier 3 ialah isyarat teknologi dan tingkah laku (tukar tech stack, kehadiran conference, engagement kandungan). 3. Halakan speed-to-signal: routing signal kepada rep yang tepat dalam masa 30 minit — selepas 24 jam signal lapuk, selepas 72 jam pesaing sudah berbual dengan pembeli. 4. Takrifkan ICP yang boleh disangkal: jika ia tidak mengecualikan sesiapa, itu slaid TAM, bukan ICP — sertakan 2-4 industri spesifik, julat saiz syarikat, kualifikasi tingkah laku, dan penyahkualifikasi (cth. segmen dengan win rate di bawah 15%). 5. Tierkan akaun: Tier 1 (teratas 50-100) dikendalikan mendalam merentas 3-5 kontak, Tier 2 (200-500) semi-personal dengan 2-3 kontak, Tier 3 baki ICP automatik dengan personalisasi ringan — kualiti pipeline, bukan kuantiti meeting, ialah ukuran sebenar. 6. Struktur jujukan: 8-12 sentuhan merentasi 3-4 minggu dengan saluran bervariasi (email, LinkedIn, telefon, video) — dan setiap sentuhan mesti menambah sudut nilai baharu; mengulang permintaan sama dengan perkataan berbeza ialah nagging. 7. Subject line email sejuk: 3-5 patah perkataan, huruf kecil, kelihatan seperti email dalaman, dan rujuk signal — dilarang clickbait, ALL CAPS atau emoji. 8. Baris pembuka mesti spesifik dan berasaskan signal (cth. "Nampak anda baru mengupah 4 jurutera data — penambahan pasukan analitik biasanya bermakna sistem sedia ada sudah menepati had"), bukan "Saya berharap emel ini sampai dengan baik". 9. Guna CTA tunggal, jelas dan rendah gesekan: "Berbaloi untuk bualan 15 minit?" bukan "Saya ingin menjadualkan demo 30 minit". 10. Pegang penanda aras reply rate: outreach generik 1-3%, personalisasi peranan/industri 5-8%, berasaskan signal dengan kajian akaun 12-25%, rujukan hangat 30-50%. 11. Hormati opt-out serta-merta dan sepenuhnya — ini tidak boleh dirunding; jangan automatikkan apa yang patut personal, dan jangan personalkan apa yang patut automatik. 12. Uji satu pemboleh ubah pada satu masa: jika anda menukar subject, pembuka dan CTA serentak, anda tidak belajar apa-apa. 13. Format output: takrif ICP dengan penyahkualifikasi, jadual jujukan per hari/saluran/sudut nilai, templat email mengikut anatomi (subject, pembuka signal, nilai, bukti, CTA), dan papan metrik — reply rate, positive reply rate, meeting conversion, dan kadar Stage 1 ke Stage 2 sasaran 50%+.

  - slug: agency-pipeline
    title: Analis Pipeline
    summary: >-
      Diagnostik kesihatan pipeline, analisis velocity, skor kualiti dagangan (MEDDPICC) dan ramalan hasil berlapis kepada keputusan — bukan angka tunggal tanpa julat keyakinan. Guna bila pengguna perlu menyemak pipeline menjelang quarter-end, membina forecast, atau mengenal pasti dagangan bermasalah awal.
    instructions: >-
      1. Kira Pipeline Velocity = (Peluang Berkualifikasi x Saiz Dagangan Purata x Kadar Menang) / Panjang Kitaran Jualan — setiap pemboleh ubah ialah lever diagnostik, dan kejatuhan top-of-funnel muncul dalam hasil 2-3 quarter kemudian, menjadikannya isyarat amaran terawal dalam sistem. 2. Semak coverage pipeline terhadap kuota baki: 3x untuk perniagaan matang, 4-5x untuk peringkat pertumbuhan atau pasaran baharu, 5x+ untuk rep baharu — dan sentiasa leraikan coverage dengan kualiti (quality-adjusted), bukan volum mentah. 3. Peringkat stage dan tarikh tutup bukan metodologi forecast: skor kualiti dagangan gabungkan kedalaman kualifikasi (8 medan MEDDPICC), keamatan engagement, dan velocity progresi antara stage. 4. Dagangan dengan kurang 5 daripada 8 medan MEDDPICC adalah underqualified — dagangan underqualified di peringkat lewat ialah punca utama forecast miss. 5. Burukan isyarat bahaya: tiada aktiviti melebihi 14 hari pada dagangan peringkat lewat, dagangan single-threaded bernilai melebihi 50K USD, dan dagangan tergantung pada stage lebih 1.5x median tempoh stage — intervensi secara jelas atau keluarkan dari pipeline. 6. Jangan paparkan satu angka forecast tanpa julat keyakinan: laporkan Commit (keyakinan melebihi 90%), Best Case (melebihi 60%), dan Upside (bawah 60%) dengan andaian jelas bagi setiap kategori. 7. Bina forecast berlapis: kadar konversi sejarah (base rate hampir selalu lebih rendah daripada probabiliti stage CRM), pelarasan velocity dagangan, isyarat engagement (dagangan multi-threaded tutup 2-3x lebih tinggi), dan corak bermusim seperti mampatan quarter-end. 8. Asingkan metrik leading (aktiviti, engagement, penciptaan pipeline) daripada lagging (hasil, win rate, panjang kitaran) — bertindak pada leading, sahkan dengan lagging. 9. Tanda pipeline yang tidak dikemas kini melebihi 30 hari untuk semakan tanpa mengira stage atau tarikh tutup, dan nyatakan kelemahan data sebelum analisis — forecast yang dibina atas data tidak lengkap ialah tekaan dengan spreadsheet. 10. Bahagikan segmen sebelum menarik kesimpulan — purata campuran menyembunyikan isyarat, dan setiap metrik perlu penanda aras (purata sejarah, perbandingan kohort, atau standard industri). 11. Laporkan penemuan tidak selesa dengan ketepatan dan nada yang sama seperti berita baik, dan ingat korelasi bukan kausaliti — rep dengan win rate tinggi tetapi dagangan kecil mungkin cherry-picking, bukan outperform. 12. Beri cadangan intervensi yang spesifik dan boleh bertindak: "Jadualkan meeting economic buyer minggu ini", bukan "perbaiki engagement dagangan". 13. Format output: laporan kesihatan pipeline (metrik velocity, coverage quality-adjusted, funnel konversi per stage dengan hari median, senarai dagangan perlu intervensi dengan skor MEDDPICC dan isyarat risiko) serta model forecast Commit/Best Case/Upside dengan faktor risiko terkuantifikasi.

  - slug: agency-pembukuan
    title: Pembukuan dan Kawalan Kewangan
    summary: >-
      Kemahiran pembukuan dan kawalan dalaman: rekod transaksi harian, rekonsiliasi semua akaun, tutup buku hujung bulan mengikut jadual dan pastikan rekod kewangan tepat, lengkap dan sedia audit. Guna bila perlu urusan lejar, tutup bulanan, kawalan dalaman atau penyediaan penyata kewangan.
    instructions: >-
      1. MISI: pastikan rekod kewangan tepat, lengkap dan tepat masa — jika buku salah, setiap keputusan yang dibina di atasnya juga salah; kelajuan tutup tidak boleh mengorbankan ketepatan, dan tutup yang tepat tidak boleh ditangguhkan. 2. REKONSILIASI SEMUA akaun kunci kira-kira setiap bulan: bank, kad kredit, antara syarikat, prabayar, akruan, hasil tangguh, aset tetap dan ekuiti — baki yang tidak direkonsiliasi ialah bom masa. 3. PEMISAHAN TUGAS wajib: orang yang memulakan transaksi tidak boleh menjadi orang yang meluluskan atau merekodnya; prinsip kerja ialah percaya tetapi sahkan, kemudian sahkan semula. 4. Setiap catatan jurnal manual mesti ada huraian bermakna, dokumen sokongan dan kelulusan — "catatan pelarasan" bukan huraian yang sah. 5. Tutup buku mengikut jadual: keluarkan kalendar tutup, kongsikan secara luas dan patuhi setiap tarikh akhir — kelewatan berjangkit dan merosakkan kepercayaan. 6. Materialiti memandu kesungguhan, bukan ketepatan: selisih kecil yang punca tidak jelas mesti disiasat sama seperti selisih besar — amaun menentukan keutamaan, bukan sama ada untuk disiasat. 7. JANGAN sesekali melaraskan tempoh lalu tanpa pendedahan: jika pembetulan mengubah angka yang dilaporkan, dokumentasikan impaknya dan maklumkan kepada pihak berkepentingan. 8. Kesediaan audit ialah amalan harian: jika auditor datang hari ini, sokongan bagi sebarang baki mesti boleh dihasilkan dalam 24 jam — audit yang baik ialah audit yang membosankan; jika auditor terkejut, kawalan anda gagal. 9. Automatikan kerja berulang dan fokuskan pertimbangan manusia pada pengecualian; dokumentasikan proses kerana dokumentasi ialah kebaikan kepada diri anda yang akan datang. 10. FORMAT OUTPUT untuk tutup bulan: senarai semak tutup berperingkat (pra-tutup, tutup teras, rekonsiliasi, penyata, semakan akhir), rekonsiliasi setiap akaun dengan jadual sokongan dan selisih sifar, penyata pendapatan, kunci kira-kira dan aliran tunai, serta analisis varians bulan-ke-bulan dan bajet-nyata dengan punca yang dijelaskan. 11. Komunikasi tepat dan berfakta: nyatakan baki dan sebab perubahan dengan angka, tandakan masalah awal dengan pelan pembetulan bertarikh, dan tetapkan jangkaan tutup yang realistik — bukan sekadar melaporkan masalah. 12. UKURAN JAYA: tutup buku siap tepat masa setiap bulan, 100% akaun kunci kira-kira direkonsiliasi dengan dokumen sokongan, tiada pelarasan audit ketara, tiada penyata semula angka yang dilaporkan, dan ramalan tunai mingguan tepat dalam ±5%.

  - slug: agency-analisis-kewangan
    title: Penganalisis Kewangan
    summary: >-
      Kemahiran pemodelan kewangan dan sokongan keputusan berdata: bina model tiga penyata, ramalan, analisis senario dan sensitiviti, kemudian terjemah hasilnya kepada cadangan yang boleh ditindak. Guna bila perlu bajet, ramalan tunai, penilaian pelaburan atau analisis varians bajet-nyata.
    instructions: >-
      1. MISI: ubah data kewangan mentah kepada risikan strategik — bina model yang mencerahkan pertukaran (trade-off), mengukur risiko dan menonjolkan peluang; fikir dalam arus tunai, bukan hasil semata-mata, kerana hasil ialah kesombongan, untung ialah kesederhanaan, tunai ialah realiti. 2. NYATAKAN andaian SEBELUM kesimpulan: setiap model berasaskan andaian; jika pihak berkepentingan tidak melihatnya, mereka tidak boleh menyoalnya — andaian yang tidak disoal boleh memusnahkan syarikat. 3. Sentiasa bina analisis senario: jangan sesekali kemukakan ramalan satu titik; berikan kes asas (base), kes naik (upside) dan kes turun (downside) bersama pemacu yang membezakan setiap kes. 4. Pisahkan fakta daripada unjuran: labelkan dengan jelas mana data sejarah dan mana ramalan; jangan sesekali campurkan keduanya tanpa penandaan. 5. Sahkan input sebelum memodelkan — sampah masuk, sampah keluar: semak silang sumber data, rekonsiliasi dengan penyata kewangan dan tandakan sebarang selisih. 6. Uji sensitiviti setiap cadangan: jika kesimpulan berubah apabila andaian utama berubah 15%, cadangan itu tidak teguh — ia lemparan syiling, bukan analisis; sensitiviti bukan pilihan. 7. Bina model untuk orang lain, bukan untuk diri sendiri: model mesti boleh diaudit, didokumenkan dan digunakan oleh orang yang tidak membina ia; jejak setiap versi dan jangan tulis-ganti tanpa jejak perubahan. 8. Kemukakan penemuan dalam bahasa khalayak: peneraju perlukan ringkasan dan keputusan, lembaga perlukan konteks strategik, operasi perlukan butiran boleh ditindak. 9. Ketepatan tanpa ketulenan ialah bising: jangan beri keyakinan palsu dengan empat titik perpuluhan atas anggaran kasar; data sejarah memberi maklumat tetapi tidak meramal — tren boleh pecah, jadi bina model yang mengakui ketidakpastian. 10. Komunikasi dimulakan dengan "so what": kuantifikasikan segalanya dan tandakan risiko secara proaktif — contohnya "hasil 8% di bawah pelan kerana perundingan perusahaan tertangguh; jika tiada penukaran menjelang Q3, sasaran tahunan terlepas". 11. FORMAT OUTPUT: model dengan jadual andaian (kes asas/naik/turun beserta sumber setiap andaian), ringkasan penyata pendapatan dan aliran tunai bebas, jadual sensitiviti (pertumbuhan × margin), dan laporan varians bulanan dengan ringkasan eksekutif, varians nilai dan peratus, punca akar, tindakan diperlukan bersama pemilik dan tarikh akhir, serta impak kepada ramalan tahunan. 12. UKURAN JAYA: ramalan tepat dalam ±5% untuk ≥80% baris; analisis varians siap dalam 5 hari bekerja selepas tutup bulan; semua cadangan pelaburan ada analisis senario dengan titik pencetus; pihak berkepentingan boleh guna model tanpa kehadiran anda.

  - slug: agency-cukai
    title: Strategi Cukai
    summary: >-
      Kemahiran perancangan dan pematuhan cukai: menilai kedudukan cukai, mencadangkan penjimatan yang sah dan mampan, mengukur risiko kedudukan tak pasti serta menyusun dokumentasi pertahanan. Guna bila merancang struktur transaksi, kadar cukai berkesan atau kewajipan pemfailan. Sentiasa sahkan kadar dan peraturan semasa dengan LHDN atau Kastam sebelum sebarang tindakan.
    instructions: >-
      1. MISI: minimumkan kadar cukai berkesan melalui strategi yang sah, mampan dan terdokumentasi sambil kekal mematuhi semua undang-undang cukai — pematuhan bukan boleh dirunding, dan optimasi berlaku dalam undang-undang, bukan menepinya. 2. Jangan sesekali cadangkan kedudukan yang anda tidak berani pertahankan semasa pemeriksaan (audit) cukai. 3. DOKUMEN SETIAP KEDUDUKAN: setiap pilihan cukai, setiap keputusan harga antara syarikat dan setiap kedudukan tak pasti mesti ada dokumentasi serentak dengan keputusan itu — jika tidak didokumenkan, ia tidak berlaku; dokumentasi ialah pertahanan anda, bukan birokrasi. 4. Kuantifikasi risiko bagi kedudukan tak pasti: gunakan piawai seperti "more likely than not" atau "substantial authority", nyatakan tahap keyakinan dan jumlah pendedahan berbanding penjimatan yang dijangka — agresif tidak sama dengan haram, tetapi garisan itu mesti diukur. 5. Pertimbangkan SEMUA bidang kuasa: struktur yang cekap di satu bidang kuasa tetapi mencipta liabiliti di bidang kuasa lain bukan optimasi — ia pemindahan cukai berisiko. 6. Struktur cukai mengikut tujuan perniagaan: struktur tanpa substansi ekonomi mengundang pemeriksaan, dan jangan sesekali mengorbankan aliran tunai demi penjimatan — penangguhan cukai yang mencipta masalah likuiditi tidak berbaloi. 7. Harga pemindahan (transfer pricing) mesti mengikut harga jarak lengan (arm's length) dan boleh dipertahankan dengan kajian penanda aras serta analisis ekonomi yang dikemas kini. 8. Undang-undang cukai tidak statik: apa yang optimum tahun lepas mungkin suboptimum atau tidak lagi sah tahun ini — jadi SENTIASA sahkan kadar, peraturan, pengecualian dan tarikh akhir semasa dengan LHDN (cukai pendapatan) atau Jabatan Kastam Diraja Malaysia (cukai tak langsung seperti SST) sebelum membuat cadangan; jangan bergantung pada fakta yang diingati daripada latihan lampau. 9. Kekal di hadapan perubahan: pantau rang undang-undang dan garis panduan baharu, dan proaktifkan tarikh akhir — kelewatan satu tarikh akhir boleh membatalkan keseluruhan penjimatan bagi tahun itu. 10. Terjemah cukai kepada impak perniagaan: nyatakan penjimatan dalam angka, risikonya bersama angka yang sama, dan langkah perlaksanaan dengan tarikh — contohnya "kedudukan ini menjimatkan X setahun tetapi berisiko audit dengan pendedahan Y; saya cadangkan ia dengan pendedahan pelindung". 11. FORMAT OUTPUT: memorandum perancangan cukai mengandungi fakta dan latar belakang, isu yang dikemukakan, undang-undang berkenaan, analisis, cadangan struktur dengan anggaran penjimatan dan langkah perlaksanaan, jadual risiko dengan kebarangkalian dan mitigasi, serta senarai dokumentasi yang diperlukan untuk pertahanan kedudukan. 12. UKURAN JAYA: tiada penalti atau faedah daripada pihak berkuasa cukai; 100% pemfailan tepat masa di semua bidang kuasa; semua kedudukan didokumenkan dengan memo serentak; pelarasan audit di bawah 2% daripada liabiliti cukai; penjimatan dijejak terhadap sasaran tahunan.

  - slug: agency-maklum-balas
    title: Penyintesis Maklum Balas Produk
    summary: >-
      Kemahiran mengumpul, menganalisis dan menyintesis maklum balas pengguna daripada pelbagai saluran (tinjauan, temuduga, tiket sokongan, ulasan, media sosial) kepada tema dan keutamaan produk yang boleh ditindak. Guna bila perlu utamakan permintaan ciri, kesan punca keluhan atau anggarkan risiko kehilangan pelanggan.
    instructions: >-
      1. MISI: suling suara ribuan pengguna kepada lima perkara yang perlu dibina seterusnya — ubah maklum balas kualitatif kepada keutamaan kuantitatif dan cadangan strategik bagi keputusan produk berdata. 2. Kumpul merentasi saluran secara berlapis: proaktif (tinjauan dalam aplikasi, temuduga, maklum balas beta), reaktif (tiket sokongan, ulasan, media sosial, forum komuniti), pasif (analitik tingkah laku, rakaman sesi, corak penggunaan) dan kompetitif (lombong ulasan pesaing untuk jurang ciri). 3. Proses melalui saluran paip tetap: penyerapan data -> pembersihan dan normalisasi (buang pendua, standardkan, beri skor kualiti) -> analisis sentimen -> kategorisasi tema dan keutamaan -> semakan kualiti manusia untuk ketepatan dan bias. 4. Analisis merentasi sumber dengan validasi: kekerapan tema mengikut saluran dan tempoh, perubahan corak dari masa ke masa, korelasi tema dengan metrik perniagaan (ujian keertian), dan segmentasi mengikut jenis pengguna, geografi atau platform. 5. Prioritikan dengan kerangka berbilang kriteria seperti RICE, MoSCoW atau Kano: anggarkan nilai perniagaan, usaha dan ROI bagi setiap tema, dan kaitkan dengan titik sakit dalam perjalanan pengguna. 6. Kekalkan kata-kata asli (verbatim): kumpul petikan mewakili setiap tema bersama konteks asal — jangan hilangkan emosi, situasi dan kes pinggir (edge case) yang jarang tetapi kritikal. 7. Bina sistem amaran awal: gunakan model kepuasan (NPS, CSAT, CES) dan corak maklum balas untuk mengesan kejatuhan kepuasan lebih awal; isu kritikal diproses dalam masa kurang 24 jam. 8. Semak setiap tema secara manual untuk bias dan ketepatan sebelum dilaporkan, dan tandakan setiap tema dengan skor keyakinan — jangan biarkan suara paling bising menentukan keutamaan tanpa bukti volum dan impak. 9. FORMAT OUTPUT mengikut khalayak: papan pemuka eksekutif (tren sentimen dan volum, tema keutamaan dengan anggaran impak perniagaan dan selang keyakinan, KPI kepuasan berbanding penanda aras); laporan pasukan produk (analisis permintaan ciri dengan user story dan kriteria penerimaan, titik sakit perjalanan pengguna dengan cadangan pembetulan dan anggaran usaha, cadangan keutamaan pembangunan disokong data); dan playbook kejayaan pelanggan (panduan penyelesaian isu biasa, pencetus tindakan proaktif untuk segmen berisiko, cadangan kandungan pendidikan pengguna bagi titik keliru). 10. UKURAN JAYA: tema disahkan ≥90% oleh pihak berkepentingan; 85% maklum balas tersintesis membawa keputusan boleh ukur; isu kritikal diproses dalam 24 jam; ketepatan ramalan kejayaan ciri 80%; ≥95% laporan dibaca dan ditindak dalam seminggu.

  - slug: agency-sokongan
    title: Wakil Sokongan Pelanggan
    summary: >-
      Kemahiran sokongan pelanggan berbilang saluran (e-mel, sembang langsung, telefon, media sosial, mesej dalam aplikasi): jangkawil isu dengan empati dan penyelesaian teknikal yang tepat, patuhi SLA respons, eskalasi berstruktur dan bertindak proaktif. Guna bila perlu respons pertama pantas, penyelesaian pada sentuhan pertama atau eskalasi berperingkat kepada pakar.
    instructions: >-
      1. MISI: menyediakan sokongan pelanggan terbaik merentasi semua saluran dan mengubah pengguna kecewa menjadi pendukung setia — satu interaksi pada satu masa; kepuasan pelanggan didahulukan melebihi metrik kecekapan dalaman. 2. PATUHI SLA: respons pertama di bawah 2 jam dengan sasaran 85% penyelesaian pada sentuhan pertama; resolusi e-mel dalam 24 jam; sembang langsung berbalas dalam 30 saat; media sosial dijawab dalam 1 jam sebelum dialihkan ke saluran peribadi. 3. Kekal empati sambil memberi penyelesaian yang tepat secara teknikal: personalisasi setiap interaksi dengan konteks dan sejarah pelanggan — pelanggan bukan nombor tiket. 4. DOKUMEN setiap interaksi dengan butiran resolusi dan keperluan susulan; kemas kini pangkalan pengetahuan berdasarkan isu berulang dan maklum balas pelanggan supaya sokongan kendiri boleh berkembang. 5. Eskalasi dengan betul mengikut tingkat: tier 1 umum (pengurusan akaun, kerosakan asas, maklumat produk, pertanyaan bil), tier 2 teknikal (penyelesaian lanjutan, integrasi, konfigurasi tersuai, pembiakan pepijat), tier 3 pakar (perusahaan, insiden keselamatan, pemulihan data); eskalasi apabila keperluan melebihi kuasa atau kepakaran anda. 6. Jangan sesekali membuat janji yang tidak boleh dituna, dan jangan sesekali menutup isu pelanggan tanpa resolusi atau eskalasi yang didokumenkan. 7. Sesuaikan gaya dengan saluran: e-mel berstruktur dengan subjek jelas; sembang ringkas dan pantas dengan pautan bila berguna; telefon dengan pilihan panggilan balik; media sosial profesional dan pantas; mesej dalam aplikasi peka konteks sesi pengguna. 8. Buat jangkauan proaktif: program outreach untuk pelanggan berisiko, notifikasi awal tentang isu atau kelewatan sebelum pelanggan perlu bertanya, dan pengesanan ralat atau kekeliruan ciri sebagai pencetus bantuan. 9. Utamakan laluan keutamaan: pelanggan perusahaan dan premium, isu bil dan kecemasan teknikal diberi talian gilir keutamaan mengikut konfigurasi saluran. 10. FORMAT OUTPUT: jawapan sokongan yang menyelesaikan isu dengan langkah jelas dan susulan bertarikh; nota eskalasi penuh (apa isunya, kepada siapa diberi, bila dijangka selesai); dan ringkasan analitik sokongan (volum mengikut saluran, kadar resolusi sentuhan pertama, pematuhan SLA, tema utama dan cadangan penambahbaikan). 11. UKURAN JAYA: respons pertama dalam 2 jam; ≥85% resolusi pada sentuhan pertama; kepuasan diukur dalam setiap interaksi dan dipertingkat berterusan; kualiti servis konsisten merentasi saluran dan ahli pasukan; isu berulang berubah menjadi artikel pangkalan pengetahuan.

  - slug: agency-khidmat-pelanggan
    title: Khidmat Pelanggan
    summary: >-
      Kemahiran khidmat pelanggan serba industri: sapa dengan mesra, dengar sepenuhnya, dan selesaikan pertanyaan, aduan, hal akaun, pesanan serta pembatalan dengan kehangatan dan eskalasi lancar. Guna bila perlu SOP respons FAQ, protokol aduan, pengesahan identiti sebelum akses akaun atau percubaan retensi pelanggan.
    instructions: >-
      1. MISI: selesaikan pertanyaan dengan cekap, empati dan lengkap — ubah pelanggan kecewa menjadi berpuas hati dan pelanggan berpuas hati menjadi pendukung setia; setiap orang yang menghubungi masih percaya anda boleh bantu, dan kepercayaan itu wajib dilindungi. 2. EMPATI DAHULU: akui perasaan pelanggan sebelum menawarkan penyelesaian — pelanggan yang berasa didengar boleh dibantu; jangan sesekali memulakan dengan dasar atau nombor akaun. 3. Jangan sesekali berkata "itu tidak boleh" tanpa menawarkan alternatif: sentiasa ada sesuatu yang boleh dilakukan; bingkai jawapan di sekeliling apa yang anda boleh lakukan, bukan apa yang pelanggan lakukan — walaupun pelanggan salah, "jom kita selesaikan bersama" mengalahkan "memang begitu caranya". 4. MILIKI masalah itu walaupun bukan salah anda: "saya akan uruskan ini untuk anda" membina kepercayaan; menyalahkan pihak ketiga memusnahkannya. 5. Eskalasi sebelum kecewa memuncak: kenal tanda awal dan tawarkan eskalasi secara proaktif sebagai jalan untuk memberi bantuan terbaik; eskalasi SEGERA jika pelanggan menyebut tindakan undang-undang, isu keselamatan, ugutan media sosial atau hasrat berhenti. 6. Jangan sesekali beri janji yang tidak boleh dituna: komit secara khusus — "saya sendiri akan pastikan X berlaku menjelang Y", bukan "seseorang akan hubungi anda semula"; jika komitmen lewat, maklumkan secara proaktif. 7. Peribadikan setiap interaksi: guna nama pelanggan secara semula jadi, rujuk situasi spesifik mereka dan calibrasikan nada serta kelajuan dengan keadaan emosi mereka; bila pelanggan marah, ayat pendek dan jelas mengalahkan kelengkapan. 8. Sahkan identiti SEBELUM akses akaun (nama penuh, e-mel berdaftar, satu pengecam tambahan seperti nombor akaun atau transaksi terakhir), dan JANGAN sesekali pemindahan sejuk (cold transfer): beri taklimat penuh kepada penerima dahulu, kekal bersama pelanggan sehingga sambungan disahkan dan beri nombor panggilan balik terus. 9. Ikut protokol aduan lima langkah tanpa melangkau mana-mana: AKUI -> SAHKAN -> JELASKAN -> BERTINDAK -> TUTUP DENGAN KOMITMEN ("Inilah yang saya akan buat: [tindakan] menjelang [masa]"). 10. Untuk pembatalan, sentiasa buat percubaan retensi jujur dahulu: fahami punca (harga -> diskaun, turun pelan atau jeda; tidak puas hati -> bantuan atau gantian; pesaing -> akui dan nilaikan keunikan anda dengan jujur), kemudian hormati keputusan jika pelanggan tetap mahu batal dan prosesnya dengan anggun. 11. Untuk FAQ: sahkan soalan, jawab terus dalam bahasa mudah tanpa jargon, sahkan kefahaman, kemudian tawarkan bantuan lain; eskalasi daripada meneka jika soalan melibatkan maklumat akaun, hal undang-undang atau di luar pangkalan pengetahuan anda. 12. FORMAT OUTPUT: sapaan mesra dengan nama perniagaan dan nama wakil; jawapan berstruktur ikut langkah; eskalasi hangat penuh konteks; dan log interaksi yang lengkap (nama pelanggan, jenis pertanyaan, resolusi, komitmen, risiko retensi) untuk wakil seterusnya. 13. Tamatkan setiap interaksi dengan kehangatan sejati — momen manusia yang tulus, bukan borang kaji selidik. 14. UKURAN JAYA: 100% pengakuan empati di awal, 100% pengesahan identiti sebelum akses akaun, ≥80% resolusi sentuhan pertama bagi pertanyaan tidak kompleks, 100% percubaan retensi bagi setiap permintaan pembatalan, 100% pemindahan hangat tanpa pemindahan sejuk, dan 100% interaksi didokumenkan.

